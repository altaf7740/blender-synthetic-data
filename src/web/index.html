<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blender Synthetic Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Material 3 color roles, generated from the tool's green seed; brass is the tertiary accent. */
:root {
  --md-primary: #2f6a57; --md-on-primary: #ffffff;
  --md-primary-container: #b3f0d8; --md-on-primary-container: #002118;
  --md-secondary: #4c6359; --md-on-secondary: #ffffff;
  --md-secondary-container: #cee9db; --md-on-secondary-container: #082017;
  --md-tertiary: #775a0b; --md-on-tertiary: #ffffff;
  --md-tertiary-container: #ffdf9e; --md-on-tertiary-container: #261a00;
  --md-error: #ba1a1a; --md-on-error: #ffffff;
  --md-error-container: #ffdad6; --md-on-error-container: #410002;
  --md-surface: #f5fbf6; --md-on-surface: #171d1a; --md-on-surface-variant: #404944;
  --md-surface-container-lowest: #ffffff; --md-surface-container-low: #eff5f0;
  --md-surface-container: #e9efea; --md-surface-container-high: #e4eae5; --md-surface-container-highest: #dee4df;
  --md-outline: #707974; --md-outline-variant: #bfc9c3;
  --md-inverse-surface: #2c322f; --md-inverse-on-surface: #ecf2ed; --md-inverse-primary: #97d4bc;
    color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --md-primary: #97d4bc; --md-on-primary: #00382a;
    --md-primary-container: #0f513f; --md-on-primary-container: #b3f0d8;
    --md-secondary: #b2ccc0; --md-on-secondary: #1e352c;
    --md-secondary-container: #344b42; --md-on-secondary-container: #cee9db;
    --md-tertiary: #e9c16c; --md-on-tertiary: #3f2e00;
    --md-tertiary-container: #5b4300; --md-on-tertiary-container: #ffdf9e;
    --md-error: #ffb4ab; --md-on-error: #690005;
    --md-error-container: #93000a; --md-on-error-container: #ffdad6;
    --md-surface: #0f1512; --md-on-surface: #dee4df; --md-on-surface-variant: #bfc9c3;
    --md-surface-container-lowest: #0a0f0d; --md-surface-container-low: #171d1a;
    --md-surface-container: #1b211e; --md-surface-container-high: #252b28; --md-surface-container-highest: #303633;
    --md-outline: #89938e; --md-outline-variant: #404944;
    --md-inverse-surface: #dee4df; --md-inverse-on-surface: #2c322f; --md-inverse-primary: #2f6a57;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --md-primary: #97d4bc; --md-on-primary: #00382a;
  --md-primary-container: #0f513f; --md-on-primary-container: #b3f0d8;
  --md-secondary: #b2ccc0; --md-on-secondary: #1e352c;
  --md-secondary-container: #344b42; --md-on-secondary-container: #cee9db;
  --md-tertiary: #e9c16c; --md-on-tertiary: #3f2e00;
  --md-tertiary-container: #5b4300; --md-on-tertiary-container: #ffdf9e;
  --md-error: #ffb4ab; --md-on-error: #690005;
  --md-error-container: #93000a; --md-on-error-container: #ffdad6;
  --md-surface: #0f1512; --md-on-surface: #dee4df; --md-on-surface-variant: #bfc9c3;
  --md-surface-container-lowest: #0a0f0d; --md-surface-container-low: #171d1a;
  --md-surface-container: #1b211e; --md-surface-container-high: #252b28; --md-surface-container-highest: #303633;
  --md-outline: #89938e; --md-outline-variant: #404944;
  --md-inverse-surface: #dee4df; --md-inverse-on-surface: #2c322f; --md-inverse-primary: #2f6a57;
  color-scheme: dark;
}
:root {
  --md-ease: cubic-bezier(.2, 0, 0, 1);            /* M3 emphasized */
  --md-elev-1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
  --md-elev-3: 0 1px 3px rgba(0,0,0,.3), 0 4px 8px 3px rgba(0,0,0,.15);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;            /* the page never scrolls; panes scroll inside */
  background: var(--md-surface); color: var(--md-on-surface);
  font: 400 14px/20px Roboto, system-ui, sans-serif; letter-spacing: .25px;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input { font: inherit; letter-spacing: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--md-primary); outline-offset: 2px; }
.i { width: 20px; height: 20px; flex: none; fill: currentColor; }
.i-24 { width: 24px; height: 24px; }

/* Type scale */
.title-l { font-size: 22px; line-height: 28px; font-weight: 400; letter-spacing: 0; }
.title-m { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: .15px; }
.title-s { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .1px; }
.label-l { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .1px; }
.label-m { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .5px; }
.body-s { font-size: 12px; line-height: 16px; letter-spacing: .4px; }
.muted { color: var(--md-on-surface-variant); }

/* State layer: the M3 hover/focus/press overlay on anything interactive. */
.state { position: relative; isolation: isolate; overflow: hidden; }
.state::after {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
  background: currentColor; opacity: 0; transition: opacity .2s var(--md-ease); pointer-events: none;
}
.state:hover::after { opacity: .08; }
.state:focus-visible::after { opacity: .1; }
.state:active::after { opacity: .12; }

/* Thin scrollbars on the panes that scroll. */
.scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--md-outline-variant) transparent; }
.scroll::-webkit-scrollbar { width: 10px; }
.scroll::-webkit-scrollbar-thumb { background: var(--md-outline-variant); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
.scroll::-webkit-scrollbar-track { background: transparent; }

/* ---- buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 24px; border: 0; border-radius: 20px; cursor: pointer;
  font-size: 14px; font-weight: 500; letter-spacing: .1px; text-decoration: none; white-space: nowrap;
}
.btn .i { width: 18px; height: 18px; margin-left: -8px; }
.btn-filled { background: var(--md-primary); color: var(--md-on-primary); }
.btn-filled:hover:not(:disabled) { box-shadow: var(--md-elev-1); }
.btn-tonal { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.btn-text { background: transparent; color: var(--md-primary); padding: 0 12px; }
.btn-text .i { margin-left: -4px; }
.btn:disabled { background: color-mix(in srgb, var(--md-on-surface) 12%, transparent); color: color-mix(in srgb, var(--md-on-surface) 38%, transparent); cursor: not-allowed; box-shadow: none; }
.btn:disabled::after { display: none; }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none;
  border: 0; border-radius: 50%; background: transparent; color: var(--md-on-surface-variant); cursor: pointer;
}
.icon-btn .i { width: 24px; height: 24px; }

/* ---- app frame: top app bar over two panes, exactly one screen tall ---- */
.app {
  height: 100dvh; display: grid;
  grid-template-columns: minmax(360px, 412px) minmax(0, 1fr);
  grid-template-rows: 64px minmax(0, 1fr);
  gap: 0 16px; padding: 0 16px 16px;
}
.top-bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 4px 0 8px; min-width: 0; }
.brand {
  display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 12px;
  background: var(--md-primary-container); color: var(--md-on-primary-container);
}
.top-bar h1 { margin: 0; flex: 1; white-space: nowrap; }

.pane { min-height: 0; min-width: 0; display: flex; flex-direction: column; border-radius: 24px; }
.setup { background: var(--md-surface-container-low); padding: 16px; gap: 16px; }
.gallery { background: var(--md-surface-container-low); padding: 16px 8px 8px 16px; }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; min-height: 24px; }
.pane-head h2 { margin: 0; }
.gallery .pane-head { padding-right: 8px; margin-bottom: 12px; }

/* ---- parts: the part of the setup pane that grows ---- */
.parts { flex: 1 1 auto; min-height: 140px; display: flex; flex-direction: column; }
.drop-area {
  flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px;
  border-radius: 16px; transition: background-color .2s var(--md-ease);
}
.bins { list-style: none; margin: 0; padding: 0 4px 0 0; display: grid; gap: 8px; align-content: start; flex: 0 1 auto; min-height: 0; }
.drop {
  position: relative; flex: 1 0 auto; min-height: 88px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;
  padding: 16px; border-radius: 16px; cursor: pointer;
  border: 1px dashed var(--md-outline); background: var(--md-surface-container);
  transition: background-color .2s var(--md-ease), border-color .2s var(--md-ease);
}
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop .badge-icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 16px; background: var(--md-primary-container); color: var(--md-on-primary-container); }
.drop-area.has-bins .drop { flex: 1 0 auto; min-height: 56px; flex-direction: row; justify-content: flex-start; text-align: left; padding: 8px 16px 8px 8px; gap: 12px; }
.drop-area.has-bins .drop .badge-icon { width: 40px; height: 40px; border-radius: 12px; }
.drop:focus-within { outline: 3px solid var(--md-primary); outline-offset: 2px; }
.drop-area.over .drop { border: 2px solid var(--md-primary); background: var(--md-primary-container); color: var(--md-on-primary-container); }

/* A dropped part: avatar, class-name field, remove button */
.part {
  display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 0 4px; align-items: start;
  padding: 10px 4px 6px 12px; border-radius: 16px; background: var(--md-surface-container-lowest);
}
.part .icon-btn { margin-top: 4px; }

/* Outlined text field (M3), with the label resting on the border */
.tf { position: relative; display: block; min-width: 0; }
.tf input {
  width: 100%; height: 48px; padding: 0 12px; border-radius: 4px;
  border: 1px solid var(--md-outline); background: transparent; color: var(--md-on-surface);
  font-size: 16px; letter-spacing: .5px;
  transition: border-color .15s var(--md-ease);
}
.tf input:hover { border-color: var(--md-on-surface); }
.tf input:focus { outline: none; border: 2px solid var(--md-primary); padding: 0 11px; }
.tf .tf-label {
  position: absolute; top: -8px; left: 8px; padding: 0 4px;
  font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--md-on-surface-variant);
  background: var(--tf-bg, var(--md-surface-container-low)); pointer-events: none;
}
.tf input:focus + .tf-label { color: var(--md-primary); }
.tf input[aria-invalid="true"] { border-color: var(--md-error); }
.tf input[aria-invalid="true"] + .tf-label { color: var(--md-error); }
.tf-support { display: block; padding: 4px 16px 0; font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--md-on-surface-variant); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tf-support.error { color: var(--md-error); white-space: normal; }
.part .tf { --tf-bg: var(--md-surface-container-lowest); }

/* ---- label type: M3 segmented button ---- */
.segmented { display: grid; grid-template-columns: repeat(3, 1fr); border: 0; margin: 0; padding: 0; min-width: 0; }
.segmented label { position: relative; display: block; min-width: 0; cursor: pointer; }
.segmented input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.segmented span {
  display: flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 8px;
  border: 1px solid var(--md-outline); margin-left: -1px;
  font-size: 13px; font-weight: 500; letter-spacing: .1px; color: var(--md-on-surface); white-space: nowrap;
  transition: background-color .2s var(--md-ease);
}
.segmented label:first-child span { border-radius: 20px 0 0 20px; margin-left: 0; }
.segmented label:last-child span { border-radius: 0 20px 20px 0; }
.segmented .i { width: 16px; height: 16px; display: none; }
.segmented input:checked + span { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.segmented input:checked + span .i { display: block; }
.segmented input:focus-visible + span { outline: 3px solid var(--md-primary); outline-offset: 2px; z-index: 1; }

/* ---- image count: text field + slider ---- */
.frames-row { display: flex; align-items: center; gap: 16px; padding-top: 6px; }
.frames-row .tf { width: 104px; flex: none; }
/* M3 slider: primary active track up to the handle, tonal track after it */
.slider {
  --fill: 50%;
  flex: 1; min-width: 0; height: 40px; margin: 0; background: transparent; cursor: pointer;
  -webkit-appearance: none; appearance: none;
}
.slider::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px;
  background: linear-gradient(90deg, var(--md-primary) var(--fill), var(--md-secondary-container) var(--fill));
}
.slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--md-secondary-container); }
.slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--md-primary); }
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px; border: 0; border-radius: 50%;
  background: var(--md-primary); box-shadow: 0 0 0 0 color-mix(in srgb, var(--md-primary) 12%, transparent);
  transition: box-shadow .2s var(--md-ease);
}
.slider::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: var(--md-primary); }
.slider:hover::-webkit-slider-thumb { box-shadow: 0 0 0 10px color-mix(in srgb, var(--md-primary) 8%, transparent); }
.slider:active::-webkit-slider-thumb { box-shadow: 0 0 0 10px color-mix(in srgb, var(--md-primary) 12%, transparent); }
.slider:focus-visible { outline: none; }
.slider:focus-visible::-webkit-slider-thumb { outline: 3px solid var(--md-primary); outline-offset: 3px; }
.slider:focus-visible::-moz-range-thumb { outline: 3px solid var(--md-primary); outline-offset: 3px; }

/* ---- summary + generate ---- */
.go { display: grid; gap: 8px; padding-top: 4px; }
.summary { margin: 0; text-align: center; }
.summary.blocked { color: var(--md-on-surface-variant); }
.go .btn { width: 100%; height: 48px; border-radius: 24px; font-size: 16px; }

/* ---- dataset panel ---- */
.gallery-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-right: 8px; margin-bottom: 12px; min-height: 40px; }
.gallery-head > div:first-child { min-width: 0; }
.gallery-head h2 { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gallery-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
.gallery-meta:empty { display: none; }
.gallery-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.tag {
  display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px;
  font-size: 12px; font-weight: 500; letter-spacing: .5px;
  background: var(--md-surface-container-high); color: var(--md-on-surface-variant);
}
.tag .i { width: 14px; height: 14px; }
.tag.ok { background: var(--md-primary-container); color: var(--md-on-primary-container); }
.tag.busy { background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); }
.tag.bad { background: var(--md-error-container); color: var(--md-on-error-container); }
.run { padding-right: 8px; margin-bottom: 12px; }
.run:empty { display: none; }

/* Stepper: one step per pipeline stage */
.steps { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 0; margin: 0 0 10px; }
.steps li { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; font-weight: 500; letter-spacing: .5px; color: var(--md-on-surface-variant); }
.steps li span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps .dot { width: 20px; height: 20px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--md-outline-variant); }
.steps .dot .i { width: 14px; height: 14px; }
.steps li.done { color: var(--md-on-surface); }
.steps li.done .dot { border: 0; background: var(--md-primary); color: var(--md-on-primary); }
.steps li.active { color: var(--md-primary); }
.steps li.active .dot { border-color: var(--md-primary); background: radial-gradient(var(--md-primary) 38%, transparent 42%); }
.steps li.failed { color: var(--md-error); }
.steps li.failed .dot { border: 0; background: var(--md-error); color: var(--md-on-error); }

/* Linear progress (M3): active track, gap, inactive track */
.progress { position: relative; height: 4px; margin: 0 0 6px; border-radius: 2px; overflow: hidden; }
.progress::before { content: ""; position: absolute; inset: 0; left: calc(var(--p) + 4px); background: var(--md-secondary-container); border-radius: 2px; }
.progress::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: var(--p); background: var(--md-primary); border-radius: 2px; transition: width .4s var(--md-ease); }
.progress.indeterminate::before { left: 0; }
.progress.indeterminate::after { width: 40%; animation: indeterminate 1.6s var(--md-ease) infinite; }
@keyframes indeterminate { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
.status { margin: 0; }
pre.log {
  margin: 0; padding: 8px 12px; max-height: 140px; overflow: auto; border-radius: 8px;
  background: var(--md-surface-container-high); color: var(--md-on-surface-variant);
  font: 12px/16px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
}

/* Image grid: virtualized - only the tiles in view exist; the spacer gives the full scroll height. */
.grid-wrap { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
.grid { position: relative; flex: 1; min-height: 0; padding-right: 8px; }
.grid-spacer { width: 1px; }
.tile {
  position: absolute; top: 0; left: 0; padding: 0; border: 0; border-radius: 12px; cursor: zoom-in;
  background: var(--md-surface-container-high); color: var(--md-on-surface);
}
.tile img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
.tile .cap {
  position: absolute; left: 6px; bottom: 6px; max-width: calc(100% - 12px); height: 22px; padding: 0 8px; border-radius: 6px;
  display: flex; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font-size: 11px; font-weight: 500; background: var(--md-surface-container-lowest); color: var(--md-on-surface);
}
.empty {
  position: absolute; inset: 0; margin: auto; height: max-content; text-align: center;
  display: grid; justify-items: center; gap: 8px; color: var(--md-on-surface-variant); pointer-events: none;
}
.empty .badge-icon { display: grid; place-items: center; width: 64px; height: 64px; margin-bottom: 8px; border-radius: 20px; background: var(--md-surface-container-highest); color: var(--md-on-surface-variant); }
.empty p { margin: 0; color: var(--md-on-surface); }

/* Dialogs (M3): the image viewer and the replace confirmation */
dialog { border: 0; padding: 0; background: transparent; color: var(--md-on-surface); max-width: none; max-height: none; }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
.viewer-body { display: grid; gap: 8px; padding: 12px; border-radius: 28px; background: var(--md-surface-container-high); }
.viewer img { display: block; max-width: min(88vw, 1000px); max-height: calc(92vh - 88px); margin: 0 auto; border-radius: 16px; background: var(--md-surface-container-highest); }
.viewer-bar { display: flex; align-items: center; gap: 4px; }
.viewer-bar .count { flex: 1; text-align: center; }
.confirm-body { width: min(340px, 90vw); padding: 24px; border-radius: 28px; background: var(--md-surface-container-high); }
.confirm-body h3 { margin: 0 0 16px; font-size: 24px; line-height: 32px; font-weight: 400; }
.confirm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }

/* Snackbar */
.snackbar {
  position: fixed; left: 50%; bottom: 24px; z-index: 10; transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 8px; min-height: 48px; max-width: min(560px, calc(100vw - 32px));
  padding: 6px 8px 6px 16px; border-radius: 4px; box-shadow: var(--md-elev-3);
  background: var(--md-inverse-surface); color: var(--md-inverse-on-surface);
  transition: opacity .2s var(--md-ease), transform .2s var(--md-ease);
}
.snackbar.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.snackbar p { margin: 0; flex: 1; }
.snackbar .btn-text { color: var(--md-inverse-primary); height: 36px; }

/* Navigation bar (compact windows only) */
.nav-bar { display: none; }

/* Short windows: the setup pane scrolls on its own, never the page. */
@media (max-height: 700px) and (min-width: 861px) {
  .setup { overflow-y: auto; }
  .parts { min-height: 150px; }
}

/* Compact windows: one pane at a time, switched from a bottom navigation bar. */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 56px minmax(0, 1fr) 80px; padding: 0 12px; gap: 0; }
  .pane { border-radius: 20px; }
  .setup { overflow-y: auto; }
  body[data-view="setup"] .gallery, body[data-view="gallery"] .setup { display: none; }
  .nav-bar {
    display: grid; grid-template-columns: 1fr 1fr; align-items: center; margin: 8px -12px 0;
    background: var(--md-surface-container); padding: 12px 0 16px;
  }
  .nav-item { display: grid; justify-items: center; gap: 4px; border: 0; background: none; cursor: pointer; color: var(--md-on-surface-variant); padding: 0; }
  .nav-item .indicator { position: relative; display: grid; place-items: center; width: 64px; height: 32px; border-radius: 16px; transition: background-color .2s var(--md-ease); overflow: visible; }

}

<div class="snackbar" id="snackbar" role="status" aria-live="polite">
  <p id="snackbar-text"></p>
  <button type="button" class="btn btn-text state" id="snackbar-action" hidden></button>
</div>

<script>
const SECONDS_PER_FRAME = 2;   // measured on an M2 Pro GPU at the default settings
const MAX_FRAMES = 20000;
const CLASS_NAME = /^[A-Za-z0-9][A-Za-z0-9 _-]{0,63}$/;
const CAD = /\.(step|stp|zip)$/i;
// Per label type: its chip name, and the preview's description (its alt text).
const TASK_TEXT = {
  segment: { name: "Segmentation", caption: "Sample images per class with their outline labels drawn on" },
  detect: { name: "Detection", caption: "Sample images per class with their box labels drawn on" },
  classify: { name: "Classification", caption: "Sample crops per class" },
};
// Datasets from before the task option have no task; they were all segmentation.
const taskOf = (job) => TASK_TEXT[job.task] ?? TASK_TEXT.segment;
const STAGES = [["convert", "Convert"], ["generate", "Render"], ["dataset", "Label"], ["package", "Package"]];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const icon = (name) => `<svg class="i" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let parts = [];  // {file, name}

// Remembered per browser: theme, last label type and image count. Storage can be unavailable; that's fine.
const remembered = {
  get(key) { try { return localStorage.getItem(`bench.${key}`); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(`bench.${key}`, value); } catch {} },
};

function classNameFrom(filename) {
  const name = filename.replace(/\.[^.]+$/, "").normalize("NFD").replace(/[̀-ͯ]/g, "")  // Parça -> Parca
    .toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  return (name || "part").slice(0, 64);
}

function duration(seconds) {
  const m = Math.round(seconds / 60);
  if (m < 1) return "under a minute";
  // Non-breaking spaces, so "1 h 8 min" never wraps mid-way.
  if (m < 60) return `${m} min`;
  return `${Math.floor(m / 60)} h ${m % 60} min`;
}

function size(bytes) {
  if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
  return `${(bytes / 1024 / 1024).toFixed(bytes < 10 * 1024 * 1024 ? 1 : 0)} MB`;
}

const task = () => document.querySelector('input[name="task"]:checked').value;
const frameCount = () => { const n = Number($("frames").value); return Number.isInteger(n) && n >= 1 && n <= MAX_FRAMES ? n : null; };

// ---- theme -----------------------------------------------------------------

const isDark = () => document.documentElement.dataset.theme
  ? document.documentElement.dataset.theme === "dark"
  : matchMedia("(prefers-color-scheme: dark)").matches;
function applyTheme(theme) {
  if (theme) document.documentElement.dataset.theme = theme;
  $("theme").innerHTML = icon(isDark() ? "light" : "dark");
  $("theme").setAttribute("aria-label", isDark() ? "Switch to light theme" : "Switch to dark theme");
}
$("theme").addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  remembered.set("theme", next);
  applyTheme(next);
});
applyTheme(remembered.get("theme"));

// ---- snackbar ----------------------------------------------------------------

let snackTimer = null;
function snackbar(message, action) {
  $("snackbar-text").textContent = message;
  const button = $("snackbar-action");
  button.hidden = !action;
  if (action) { button.textContent = action.label; button.onclick = () => { hideSnackbar(); action.run(); }; }
  $("snackbar").classList.add("show");
  clearTimeout(snackTimer);
  snackTimer = setTimeout(hideSnackbar, action ? 8000 : 5000);
}
const hideSnackbar = () => $("snackbar").classList.remove("show");

// ---- parts -----------------------------------------------------------------

function addFiles(files) {
  const first = parts.length;
  for (const file of files) parts.push({ file, name: classNameFrom(file.name) });
  renderBins();
  // Ask for the real name straight away: select the suggestion so typing replaces it.
  const input = $("bins").children[first]?.querySelector("input");
  if (input) { input.focus(); input.select(); input.scrollIntoView({ block: "nearest" }); }
}

const cleanName = (s) => s.trim().replace(/\s+/g, " ");

function problems() {
  const out = [];
  const seen = new Map();
  parts.forEach((p, i) => {
    if (!CAD.test(p.file.name)) out.push([i, "file", `${p.file.name} isn't a STEP file.`]);
    if (!p.name) out.push([i, "name", "Enter a class name."]);
    else if (!CLASS_NAME.test(p.name)) out.push([i, "name", "Use letters, digits, spaces, - and _, starting with a letter or digit."]);
    else if (seen.has(p.name)) out.push([i, "name", "Another part already has this name."]);
    seen.set(p.name, i);
  });
  return out;
}

function renderBins() {
  const bins = $("bins");
  bins.innerHTML = "";
  const issues = problems();
  parts.forEach((p, i) => {
    const issue = issues.find(([j]) => j === i);
    const li = document.createElement("li");
    li.className = "part";
    li.innerHTML = `
      <div>
        <label class="tf">
          <input value="${esc(p.name)}" spellcheck="false" maxlength="64"
                 aria-describedby="part-support-${i}" ${issue ? 'aria-invalid="true"' : ""}>
          <span class="tf-label">Class name</span>
        </label>
        <span class="tf-support ${issue ? "error" : ""}" id="part-support-${i}">${esc(issue?.[2] ?? p.file.name)}</span>
      </div>
      <button type="button" class="icon-btn state" aria-label="Remove ${esc(p.file.name)}">${icon("close")}</button>`;
    const input = li.querySelector("input");
    // Typing only updates the name and the summary; the row redraws on leaving the field.
    input.addEventListener("input", () => { p.name = cleanName(input.value); updateSummary(); });
    input.addEventListener("change", () => renderBins());
    li.querySelector("button").addEventListener("click", () => {
      const [removed] = parts.splice(i, 1);
      renderBins();
      (bins.children[Math.min(i, parts.length - 1)]?.querySelector("button") ?? $("picker")).focus();
      snackbar(`Removed ${removed.name || removed.file.name}`, { label: "Undo", run: () => { parts.splice(i, 0, removed); renderBins(); } });
    });
    bins.appendChild(li);
  });
  $("tray").classList.toggle("has-bins", parts.length > 0);
  $("parts-count").textContent = parts.length || "";
  $("drop-title").textContent = parts.length ? "Add more" : "Drop STEP files";
  updateSummary(issues);
}

// Files dropped anywhere on the page land in the parts list, instead of the browser opening them.
const tray = $("tray");
const hasFiles = (e) => [...(e.dataTransfer?.types ?? [])].includes("Files");
let dragDepth = 0;
window.addEventListener("dragenter", (e) => { if (hasFiles(e)) { e.preventDefault(); dragDepth++; tray.classList.add("over"); showView("setup"); } });
window.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("dragleave", (e) => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; tray.classList.remove("over"); } });
window.addEventListener("drop", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  tray.classList.remove("over");
  addFiles(e.dataTransfer.files);
});
$("picker").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });

// ---- settings and summary ------------------------------------------------------

function updateSummary(issues = problems()) {
  const n = frameCount();
  $("frames").setAttribute("aria-invalid", String(n === null));
  if (n !== null && document.activeElement !== $("frames-slider")) setSlider(n);

  let blocked = null;
  if (!parts.length) blocked = "Add a STEP file";
  else if (issues.some(([, kind]) => kind === "file")) blocked = "Remove the non-STEP files";
  else if (issues.length) blocked = "Fix the class names in red";
  else if (n === null) blocked = `Images: 1 to ${MAX_FRAMES}`;

  const summary = $("summary");
  summary.classList.toggle("blocked", !!blocked);
  summary.textContent = blocked ?? `About ${duration(n * SECONDS_PER_FRAME + 60)}`;
  $("submit").disabled = !!blocked;
}

$("frames").addEventListener("input", () => { updateSummary(); if (frameCount()) remembered.set("frames", frameCount()); });
// The slider is logarithmic: 20, 500 and 2000 each get a usable stretch of track,
// where a linear 1-20000 slider would squeeze them into its first few pixels.
const SLIDER_MAX = 1000;
const toSlider = (n) => Math.round(SLIDER_MAX * Math.log(n) / Math.log(MAX_FRAMES));
function fromSlider(v) {
  const x = Math.exp((v / SLIDER_MAX) * Math.log(MAX_FRAMES));
  const step = x < 50 ? 1 : x < 200 ? 5 : x < 1000 ? 10 : x < 5000 ? 50 : 100;   // snap to round numbers
  return Math.min(MAX_FRAMES, Math.max(1, Math.round(x / step) * step));
}
function setSlider(n) {
  const slider = $("frames-slider");
  slider.value = toSlider(n);
  slider.style.setProperty("--fill", `${(100 * slider.value) / SLIDER_MAX}%`);
  slider.setAttribute("aria-valuetext", plural(n, "image", "images"));
}
$("frames-slider").addEventListener("input", (e) => {
  const n = fromSlider(+e.target.value);
  $("frames").value = n;
  e.target.style.setProperty("--fill", `${(100 * e.target.value) / SLIDER_MAX}%`);
  e.target.setAttribute("aria-valuetext", plural(n, "image", "images"));
  remembered.set("frames", n);
  updateSummary();
});
document.querySelectorAll('input[name="task"]').forEach((r) => r.addEventListener("change", () => { remembered.set("task", task()); updateSummary(); }));

const savedTask = document.querySelector(`input[name="task"][value="${remembered.get("task")}"]`);
if (savedTask) savedTask.checked = true;
if (remembered.get("frames")) $("frames").value = remembered.get("frames");
updateSummary();

// ---- generate (replaces the current dataset) ----------------------------------------

let current = { status: "none" };   // the dataset, as the server reports it

async function generate() {
  const body = new FormData();
  parts.forEach((p) => { body.append("files", p.file); body.append("classes", p.name); });
  body.append("num_frames", String(frameCount()));
  body.append("task", task());
  $("submit").disabled = true;
  $("submit-label").textContent = "Uploading…";
  try {
    const res = await fetch("/api/dataset", { method: "POST", body });
    if (!res.ok) throw new Error((await res.json()).detail ?? `Upload failed (${res.status}).`);
    parts = [];
    renderBins();
    showView("gallery");
    await refresh();
  } catch (ex) {
    snackbar(ex.message === "Failed to fetch" ? "Can't reach the server" : ex.message);
    renderBins();
  } finally {
    $("submit-label").textContent = "Generate dataset";
  }
}

// Generating deletes the dataset that's there, so ask first.
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (current.status === "none") generate();
  else { $("confirm").returnValue = ""; $("confirm").showModal(); }
});
$("confirm").addEventListener("close", () => { if ($("confirm").returnValue === "replace") generate(); });

// ---- dataset header --------------------------------------------------------------

// Pieces are only rewritten when they change, so polling doesn't steal focus (e.g. from Cancel).
function setHtml(el, html) {
  if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; }
}

function stepsHtml(d) {
  const at = STAGES.findIndex(([key]) => key === d.stage);
  return STAGES.map(([, label], i) => {
    let cls = "", mark = "";
    if (d.status === "done" || i < at) { cls = "done"; mark = icon("check"); }
    else if (i === at && d.status === "failed") { cls = "failed"; mark = icon("close"); }
    else if (i === at && d.status === "running") cls = "active";
    return `<li class="${cls}"><span class="dot">${mark}</span><span>${label}</span></li>`;
  }).join("");
}

function runHtml(d) {
  if (d.status === "failed") return `<ol class="steps" aria-label="Progress">${stepsHtml(d)}</ol><pre class="log">${esc(d.error)}</pre>`;
  if (d.status !== "running") return "";
  const steps = `<ol class="steps" aria-label="Progress">${stepsHtml(d)}</ol>`;
  if (d.stage !== "generate") return `${steps}<div class="progress indeterminate" role="progressbar" aria-label="Working"></div>`;
  const pct = Math.round(100 * d.frames_done / d.num_frames);
  const eta = d.eta_seconds == null ? "" : `, ${d.eta_seconds < 60 ? "<1 min" : duration(d.eta_seconds)} left`;
  return `${steps}<div class="progress" style="--p:${pct}%" role="progressbar" aria-label="Rendering" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"></div>
    <p class="status body-s muted">${d.frames_done} / ${d.num_frames}${eta}</p>`;
}

// Classification yields one crop per visible part, so its count differs from the images rendered.
const countText = (d) => d.task === "classify" && grid.kind === "dataset" ? plural(grid.count, "crop", "crops") : plural(d.num_frames, "image", "images");

function renderHead() {
  const d = current;
  const none = d.status === "none";
  $("gallery-title").textContent = none ? "Dataset" : d.classes.join(", ");
  const tag = { running: `<span class="tag busy">Running</span>`, done: `<span class="tag ok">${icon("check")}Ready</span>`,
                failed: `<span class="tag bad">${icon("error")}Failed</span>`, cancelled: `<span class="tag">Cancelled</span>` }[d.status] ?? "";
  setHtml($("gallery-meta"), none ? "" : `${tag}<span class="tag">${taskOf(d).name}</span><span class="tag">${countText(d)}</span>`);
  setHtml($("gallery-actions"),
    d.status === "running" ? `<button type="button" class="btn btn-text state" data-cancel>Cancel</button>`
    : d.status === "done" ? `<a class="btn btn-tonal state" href="/api/dataset/download">${icon("download")}Download${d.zip_bytes ? ` (${size(d.zip_bytes)})` : ""}</a>`
    : "");
  setHtml($("run"), runHtml(d));
  $("nav-badge").hidden = d.status !== "running";
}

$("gallery-actions").addEventListener("click", async (e) => {
  const button = e.target.closest("[data-cancel]");
  if (!button) return;
  button.disabled = true;
  button.textContent = "Cancelling…";
  await fetch("/api/dataset/cancel", { method: "POST" });
  refresh();
});

// ---- image grid (virtualized) -------------------------------------------------------
//
// Thousands of images: only the tiles in view (plus a couple of rows either
// side) exist in the page; a spacer gives the scrollbar the full height.

const gridEl = $("grid");
const grid = { kind: null, version: null, count: 0, labels: null };
const TILE_MIN = 150, GAP = 8;
const tiles = new Map();   // index -> tile element
let cols = 1, tileSize = TILE_MIN;

const thumbUrl = (i) => `/api/dataset/thumb/${grid.kind}/${i}?v=${grid.version}`;
const imageUrl = (i) => `/api/dataset/image/${grid.kind}/${i}?v=${grid.version}`;
const labelOf = (i) => grid.labels?.[i] ?? "";

function clearTiles() {
  tiles.forEach((el) => el.remove());
  tiles.clear();
}

function layout() {
  const width = gridEl.clientWidth - 8;   // minus the padding kept for the scrollbar
  cols = Math.max(1, Math.floor((width + GAP) / (TILE_MIN + GAP)));
  tileSize = (width - GAP * (cols - 1)) / cols;
  $("grid-spacer").style.height = `${Math.ceil(grid.count / cols) * (tileSize + GAP)}px`;
  tiles.forEach((el, i) => place(el, i));
  draw();
}

function place(el, i) {
  el.style.width = el.style.height = `${tileSize}px`;
  el.style.transform = `translate(${(i % cols) * (tileSize + GAP)}px, ${Math.floor(i / cols) * (tileSize + GAP)}px)`;
}

function draw() {
  const row = tileSize + GAP;
  const first = Math.max(0, Math.floor(gridEl.scrollTop / row) - 2) * cols;
  const last = Math.min(grid.count, Math.ceil((gridEl.scrollTop + gridEl.clientHeight) / row + 2) * cols);
  tiles.forEach((el, i) => { if (i < first || i >= last) { el.remove(); tiles.delete(i); } });
  for (let i = first; i < last; i++) {
    if (tiles.has(i)) continue;
    const el = document.createElement("button");
    el.type = "button";
    el.className = "tile state";
    el.dataset.index = i;
    el.setAttribute("aria-label", `Image ${i + 1}${labelOf(i) ? `, ${labelOf(i)}` : ""}`);
    el.innerHTML = `<img alt="" loading="lazy" decoding="async" src="${thumbUrl(i)}">${labelOf(i) ? `<span class="cap">${esc(labelOf(i))}</span>` : ""}`;
    place(el, i);
    gridEl.appendChild(el);
    tiles.set(i, el);
  }
}

let drawQueued = false;
gridEl.addEventListener("scroll", () => {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; draw(); });
});
new ResizeObserver(layout).observe(gridEl);
gridEl.addEventListener("click", (e) => { const t = e.target.closest(".tile"); if (t) openViewer(+t.dataset.index); });
// A thumbnail requested the moment its frame lands can miss; try once more.
gridEl.addEventListener("error", (e) => {
  const img = e.target;
  if (img.tagName !== "IMG" || img.dataset.retried) return;
  img.dataset.retried = "1";
  setTimeout(() => { img.src = img.src; }, 1500);
}, true);

async function refreshImages() {
  const r = await (await fetch("/api/dataset/images")).json();
  const version = current.created ?? 0;
  if (r.kind !== grid.kind || version !== grid.version) {   // new dataset, or renders -> finished dataset
    clearTiles();
    gridEl.scrollTop = 0;
    Object.assign(grid, { kind: r.kind, version });
  }
  const grew = r.count !== grid.count;
  grid.count = r.count;
  grid.labels = r.labels;
  $("empty").hidden = grid.count > 0;
  if (grew) layout();
  renderHead();   // the count chip depends on the images
}

// ---- viewer ------------------------------------------------------------------

let viewing = 0;
function openViewer(i) {
  viewing = i;
  showImage();
  $("viewer").showModal();
}
function showImage() {
  $("viewer-img").src = imageUrl(viewing);
  $("viewer-img").alt = `Image ${viewing + 1} of ${grid.count}`;
  $("viewer-count").textContent = `${viewing + 1} / ${grid.count}${labelOf(viewing) ? `, ${labelOf(viewing)}` : ""}`;
  $("viewer-prev").disabled = viewing === 0;
  $("viewer-next").disabled = viewing >= grid.count - 1;
}
const step = (by) => { const i = viewing + by; if (i >= 0 && i < grid.count) { viewing = i; showImage(); } };
$("viewer-prev").addEventListener("click", () => step(-1));
$("viewer-next").addEventListener("click", () => step(1));
$("viewer-close").addEventListener("click", () => $("viewer").close());
$("viewer").addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
});
$("viewer").addEventListener("click", (e) => { if (e.target === $("viewer")) $("viewer").close(); });   // backdrop

// ---- compact windows: one pane at a time -------------------------------------------

function showView(view) {
  document.body.dataset.view = view;
  document.querySelectorAll(".nav-item").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.view === view)));
  if (view === "gallery") requestAnimationFrame(layout);   // the grid had no size while hidden
}
document.querySelectorAll(".nav-item").forEach((t) => t.addEventListener("click", () => showView(t.dataset.view)));

// ---- polling ----------------------------------------------------------------------

let timer = null;
let lastStatus = null;
async function refresh() {
  clearTimeout(timer);
  try {
    current = await (await fetch("/api/dataset")).json();
  } catch {
    timer = setTimeout(refresh, 5000);
    return;
  }
  if (lastStatus === "running" && current.status === "done") snackbar("Dataset ready", { label: "Download", run: () => { location.href = "/api/dataset/download"; } });
  if (lastStatus === "running" && current.status === "failed") snackbar("Generation failed");
  lastStatus = current.status;
  try {
    renderHead();
    await refreshImages();
  } finally {
    // Keep polling even if drawing fails, so the rest still updates.
    if (current.status === "running") timer = setTimeout(refresh, 2000);
  }
}
refresh();
</script>
</body>
</html>
